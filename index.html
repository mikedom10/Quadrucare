<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Information - Quadrucare</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container header-content">
            <img src="images/logo.jpg" alt="Quadrucare Logo" class="logo">
            <h1>Client Information</h1>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <p class="intro-text">Please fill out the form below with your details.</p>
            
            <form name="client-info" method="POST" data-netlify="true" class="client-form">
                <input type="hidden" name="form-name" value="client-info">
                
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ranchName">Ranch Name</label>
                    <input type="text" id="ranchName" name="ranchName" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>

                <fieldset class="checkbox-group">
                    <legend>Installation Application</legend>
                    <div class="checkbox-option">
                        <input type="checkbox" id="barnAlley" name="locations" value="Barn Alley">
                        <label for="barnAlley">Barn Alley</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="washRack" name="locations" value="Wash Rack">
                        <label for="washRack">Wash Rack</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="vetClinic" name="locations" value="Vet Clinic">
                        <label for="vetClinic">Vet Clinic</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="tackRoom" name="locations" value="Tack Room">
                        <label for="tackRoom">Tack Room</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="trailer" name="locations" value="Trailer">
                        <label for="trailer">Trailer</label>
                    </div>
                    <div class="checkbox-option other-option">
                        <input type="checkbox" id="other" name="locations" value="Other">
                        <label for="other">Other</label>
                        <input type="text" id="otherInfo" name="otherInfo" placeholder="Please specify" disabled class="other-input">
                    </div>
                </fieldset>

                <fieldset class="checkbox-group">
                    <legend>How soon would you like this project done?</legend>
                    <div class="checkbox-option">
                        <input type="radio" id="timeline-0-1" name="timeline" value="0-1 month">
                        <label for="timeline-0-1">0-1 month</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="radio" id="timeline-1-3" name="timeline" value="1-3 months">
                        <label for="timeline-1-3">1-3 months</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="radio" id="timeline-6" name="timeline" value="6 months">
                        <label for="timeline-6">6 months</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="radio" id="timeline-year" name="timeline" value="within the next year">
                        <label for="timeline-year">Within the next year</label>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Submit Information</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Quadrucare. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Script to handle 'Other' checkbox interaction
        const otherCheckbox = document.getElementById('other');
        const otherInput = document.getElementById('otherInfo');

        otherCheckbox.addEventListener('change', function() {
            if (this.checked) {
                otherInput.disabled = false;
                otherInput.focus();
            } else {
                otherInput.disabled = true;
                otherInput.value = ''; // Clear input if unchecked
            }
        });
    </script>
</body>
</html>
