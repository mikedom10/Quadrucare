<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Information Capture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Client Information</h1>
        <form name="client-info" method="POST" data-netlify="true" netlify-honeypot="bot-field">
            <!-- Hidden honeypot field for spam protection -->
            <p class="hidden">
                <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
            </p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required placeholder="1234 Barn Lane, Countryside, TX">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="(555) 123-4567">
            </div>

            <div class="form-group">
                <label>Facilities / Areas of Interest</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="barn-alley" name="facilities" value="Barn Alley">
                        <label for="barn-alley">Barn Alley</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="wash-rack" name="facilities" value="Wash Rack">
                        <label for="wash-rack">Wash Rack</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="vet-clinic" name="facilities" value="Vet Clinic">
                        <label for="vet-clinic">Vet Clinic</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="round-pen" name="facilities" value="Round Pen">
                        <label for="round-pen">Round Pen</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="tack-room" name="facilities" value="Tack Room">
                        <label for="tack-room">Tack Room</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="trailer" name="facilities" value="Trailer">
                        <label for="trailer">Trailer</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="other" name="facilities" value="Other">
                        <label for="other">Other</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="other-info">Other Information</label>
                <textarea id="other-info" name="other-info" rows="4" placeholder="Please provide details if 'Other' is selected or any additional information..."></textarea>
            </div>

            <button type="submit">Submit Information</button>
        </form>
    </div>
</body>
</html>
