<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Information - Quadrucare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="images/Quadrucare Logo2.jpg" alt="Quadrucare Logo" class="logo">
            <h1>Client Information Capture</h1>
            <p>Please fill out the details below.</p>
        </header>

        <main>
            <form name="client-info" method="POST" data-netlify="true" netlify-honeypot="bot-field">
                <input type="hidden" name="form-name" value="client-info" />
                <p class="hidden">
                    <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
                </p>

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="row">
                    <div class="form-group half">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group half">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group checkbox-group">
                    <label>Facilities/Areas of Interest:</label>
                    <div class="checkbox-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Barn Alley"> Barn Alley
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Wash Rack"> Wash Rack
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Vet Clinic"> Vet Clinic
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Round Pen"> Round Pen
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Tack Room"> Tack Room
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Trailer"> Trailer
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="facilities" value="Other"> Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="otherInfo">Other Information</label>
                    <textarea id="otherInfo" name="otherInfo" rows="4"></textarea>
                </div>

                <button type="submit">Submit Information</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Quadrucare. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
